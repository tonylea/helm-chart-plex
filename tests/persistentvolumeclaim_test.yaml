suite: PersistentVolumeClaim
release:
  name: plex
templates:
  - templates/persistentvolumeclaim.yaml
tests:
  - it: claims 10Gi ReadWriteOnce for the config, named after the release
    asserts:
      - equal:
          path: metadata.name
          value: plex-config
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: leaves the class to the cluster's default unless one is named
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: uses the name, size and class it's given
    set:
      persistence.config:
        claimName: plex-database
        size: 50Gi
        storageClassName: fast
    asserts:
      - equal:
          path: metadata.name
          value: plex-database
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
      - equal:
          path: spec.storageClassName
          value: fast
